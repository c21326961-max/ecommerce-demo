<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shopping Cart — ShopSphere</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #101827;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 24px;
      font-weight: 800;
    }

    .back {
      color: white;
      text-decoration: none;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 45px auto;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 30px;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 25px;
    }

    .cart-items,
    .summary {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    .cart-item {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 18px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .product-image {
      width: 80px;
      height: 80px;
      border-radius: 14px;
      background: #eef2ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }

    .product-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .product-category {
      color: #667085;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .product-price {
      font-weight: 700;
    }

    .quantity-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .quantity-box button {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 8px;
      background: #eef2ff;
      cursor: pointer;
      font-size: 18px;
    }

    .quantity-box span {
      min-width: 25px;
      text-align: center;
      font-weight: 700;
    }

    .item-total {
      text-align: right;
      font-weight: 800;
      white-space: nowrap;
    }

    .remove-btn {
      display: block;
      margin-top: 10px;
      border: none;
      background: transparent;
      color: #dc2626;
      cursor: pointer;
      font-size: 13px;
    }

    .summary h2 {
      margin-bottom: 25px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 15px 0;
      color: #667085;
      gap: 20px;
    }

    .summary-total {
      border-top: 1px solid #e5e7eb;
      margin-top: 20px;
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 21px;
      font-weight: 800;
    }

    .checkout-btn {
      width: 100%;
      border: none;
      padding: 16px;
      margin-top: 25px;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .continue-btn {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #4f46e5;
      text-decoration: none;
      font-weight: 600;
    }

    .empty {
      text-align: center;
      padding: 70px 20px;
    }

    .empty-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    .empty p {
      color: #667085;
      margin: 10px 0 25px;
    }

    .shop-btn {
      display: inline-block;
      background: #111827;
      color: white;
      text-decoration: none;
      padding: 13px 22px;
      border-radius: 10px;
      font-weight: 700;
    }

    @media (max-width: 800px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .cart-item {
        grid-template-columns: 65px 1fr;
      }

      .product-image {
        width: 65px;
        height: 65px;
        font-size: 30px;
      }

      .item-total {
        grid-column: 2;
        text-align: left;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<header>

  <a href="index.html" class="logo">
    ShopSphere
  </a>

  <a href="products.html" class="back">
    ← Continue Shopping
  </a>

</header>

<div class="container">

  <h1>Your Shopping Cart</h1>

  <p class="subtitle">
    Review your products before checkout.
  </p>

  <div id="cartContent"></div>

</div>

<script>

const CART_KEY = "shopSphereCart";


function getCart() {

  try {

    return JSON.parse(
      localStorage.getItem(CART_KEY)
    ) || [];

  } catch (error) {

    return [];

  }

}


function saveCart(cart) {

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

}


function formatPrice(price) {

  return Number(price).toLocaleString("en-US") + " TSh";

}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function renderCart() {

  const cart = getCart();

  const cartContent =
    document.getElementById("cartContent");


  if (cart.length === 0) {

    cartContent.innerHTML = `

      <div class="cart-items empty">

        <div class="empty-icon">
          🛒
        </div>

        <h2>
          Your cart is empty
        </h2>

        <p>
          You have not added any products yet.
        </p>

        <a
          href="products.html"
          class="shop-btn">

          Start Shopping

        </a>

      </div>

    `;

    return;
  }


  let subtotal = 0;

  let itemsHTML = "";


  cart.forEach((item, index) => {

    const quantity =
      Number(item.quantity) || 1;

    const price =
      Number(item.price) || 0;

    const total =
      price * quantity;

    subtotal += total;


    itemsHTML += `

      <div class="cart-item">

        <div class="product-image">

          ${item.image || "🛍️"}

        </div>


        <div>

          <div class="product-name">

            ${escapeHtml(item.name)}

          </div>


          <div class="product-category">

            ${escapeHtml(
              item.category || ""
            )}

          </div>


          <div class="product-price">

            ${formatPrice(price)}

          </div>


          <div class="quantity-box">

            <button
              onclick="changeQuantity(${index}, -1)">

              −

            </button>


            <span>

              ${quantity}

            </span>


            <button
              onclick="changeQuantity(${index}, 1)">

              +

            </button>

          </div>


          <button
            class="remove-btn"
            onclick="removeItem(${index})">

            Remove

          </button>

        </div>


        <div class="item-total">

          ${formatPrice(total)}

        </div>

      </div>

    `;

  });


  cartContent.innerHTML = `

    <div class="cart-layout">


      <div class="cart-items">

        ${itemsHTML}

      </div>


      <div class="summary">

        <h2>
          Order Summary
        </h2>


        <div class="summary-row">

          <span>
            Products
          </span>

          <span>
            ${cart.length}
          </span>

        </div>


        <div class="summary-row">

          <span>
            Subtotal
          </span>

          <span>
            ${formatPrice(subtotal)}
          </span>

        </div>


        <div class="summary-row">

          <span>
            Delivery
          </span>

          <span>
            At checkout
          </span>

        </div>


        <div class="summary-total">

          <span>
            Total
          </span>

          <span>
            ${formatPrice(subtotal)}
          </span>

        </div>


        <button
          class="checkout-btn"
          onclick="goToCheckout()">

          Proceed to Checkout

        </button>


        <a
          href="products.html"
          class="continue-btn">

          ← Continue Shopping

        </a>

      </div>

    </div>

  `;

}


function changeQuantity(index, change) {

  const cart = getCart();

  if (!cart[index]) return;


  cart[index].quantity =
    (Number(cart[index].quantity) || 1)
    + change;


  if (cart[index].quantity < 1) {

    cart[index].quantity = 1;

  }


  saveCart(cart);

  renderCart();

}


function removeItem(index) {

  const cart = getCart();

  cart.splice(index, 1);

  saveCart(cart);

  renderCart();

}


function goToCheckout() {

  const cart = getCart();


  if (cart.length === 0) {

    alert("Your cart is empty.");

    return;

  }


  window.location.href =
    "checkout.html";

}


renderCart();

</script>

</body>
</html>
