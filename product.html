```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product Details — ShopSphere</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    nav {
      background: #111827;
      color: white;
      padding: 18px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-links a {
      color: #dbeafe;
      text-decoration: none;
      font-size: 15px;
    }

    .cart {
      background: #2563eb;
      color: white !important;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: bold;
    }

    .container {
      width: min(1100px, 92%);
      margin: 45px auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .product-box {
      background: white;
      border-radius: 22px;
      padding: 35px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 45px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .product-image {
      min-height: 430px;
      border-radius: 18px;
      background: #eef2ff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      max-height: 430px;
      object-fit: contain;
    }

    .emoji-image {
      font-size: 130px;
    }

    .category {
      display: inline-block;
      background: #e0e7ff;
      color: #3730a3;
      padding: 7px 13px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: bold;
      text-transform: capitalize;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 40px;
      line-height: 1.15;
      margin-bottom: 15px;
    }

    .price {
      font-size: 32px;
      font-weight: 800;
      color: #2563eb;
      margin: 20px 0;
    }

    .description {
      color: #667085;
      line-height: 1.7;
      font-size: 16px;
      margin-bottom: 22px;
    }

    .stock {
      font-weight: bold;
      margin-bottom: 25px;
    }

    .in-stock {
      color: #15803d;
    }

    .out-stock {
      color: #dc2626;
    }

    .quantity-area {
      margin: 20px 0;
    }

    .quantity-area label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .quantity-box {
      display: flex;
      align-items: center;
      width: fit-content;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      overflow: hidden;
    }

    .quantity-box button {
      width: 45px;
      height: 45px;
      border: none;
      background: #f2f4f7;
      font-size: 22px;
      cursor: pointer;
    }

    .quantity-box span {
      width: 55px;
      text-align: center;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 15px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .add {
      background: #111827;
      color: white;
    }

    .buy {
      background: #2563eb;
      color: white;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      display: none;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      text-align: center;
      padding: 80px 20px;
      font-size: 20px;
    }

    footer {
      margin-top: 60px;
      background: #111827;
      color: #9ca3af;
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 800px) {
      .product-box {
        grid-template-columns: 1fr;
        padding: 22px;
      }

      .product-image {
        min-height: 300px;
      }

      h1 {
        font-size: 30px;
      }

      .price {
        font-size: 27px;
      }

      .nav-links a:not(.cart) {
        display: none;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html" class="logo">ShopSphere</a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Shop</a>
      <a href="cart.html" class="cart">
        Cart (<span id="cartCount">0</span>)
      </a>
    </div>
  </nav>

  <main class="container">

    <a href="products.html" class="back">← Back to Shop</a>

    <div id="loading" class="loading">
      Loading product...
    </div>

    <div id="productBox" class="product-box" style="display:none;">

      <div class="product-image" id="productImage">
        <div class="emoji-image">🛍️</div>
      </div>

      <div class="product-info">

        <span class="category" id="productCategory">
          Product
        </span>

        <h1 id="productName">
          Product Name
        </h1>

        <div class="price" id="productPrice">
          TSh 0
        </div>

        <p class="description" id="productDescription">
          Product description
        </p>

        <div id="stockText" class="stock">
          Checking stock...
        </div>

        <div class="quantity-area">
          <label>Quantity</label>

          <div class="quantity-box">
            <button id="minusBtn">−</button>
            <span id="quantity">1</span>
            <button id="plusBtn">+</button>
          </div>
        </div>

        <div class="buttons">

          <button
            id="addBtn"
            class="btn add">
            Add to Cart
          </button>

          <button
            id="buyBtn"
            class="btn buy">
            Buy Now
          </button>

        </div>

        <div id="message" class="message"></div>

      </div>

    </div>

  </main>

  <footer>
    <strong>ShopSphere</strong>
    <br>
    Modern e-commerce demonstration platform.
    <br><br>
    © 2026 ShopSphere. All rights reserved.
  </footer>


<script>

  /* =========================================
     SUPABASE CONNECTION
  ========================================= */

  const SUPABASE_URL =
    "https://ienquzigbawhvthnirtj.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_tSbACTjOICJlthE03XmGCA_sIgigXup";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     GET PRODUCT ID FROM URL
  ========================================= */

  const params =
    new URLSearchParams(window.location.search);

  const productId =
    params.get("id");


  /* =========================================
     ELEMENTS
  ========================================= */

  const loading =
    document.getElementById("loading");

  const productBox =
    document.getElementById("productBox");

  const productImage =
    document.getElementById("productImage");

  const productName =
    document.getElementById("productName");

  const productCategory =
    document.getElementById("productCategory");

  const productPrice =
    document.getElementById("productPrice");

  const productDescription =
    document.getElementById("productDescription");

  const stockText =
    document.getElementById("stockText");

  const quantityText =
    document.getElementById("quantity");

  const minusBtn =
    document.getElementById("minusBtn");

  const plusBtn =
    document.getElementById("plusBtn");

  const addBtn =
    document.getElementById("addBtn");

  const buyBtn =
    document.getElementById("buyBtn");

  const message =
    document.getElementById("message");

  const cartCount =
    document.getElementById("cartCount");


  let product = null;
  let quantity = 1;


  /* =========================================
     FORMAT PRICE
  ========================================= */

  function formatPrice(price) {

    return Number(price).toLocaleString(
      "en-TZ"
    ) + " TSh";

  }


  /* =========================================
     CART COUNT
  ========================================= */

  function updateCartCount() {

    const cart =
      JSON.parse(
        localStorage.getItem("shopSphereCart") || "[]"
      );

    const total =
      cart.reduce(
        (sum, item) =>
          sum + Number(item.quantity || 0),
        0
      );

    cartCount.textContent = total;

  }


  /* =========================================
     SHOW MESSAGE
  ========================================= */

  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  /* =========================================
     LOAD PRODUCT
  ========================================= */

  async function loadProduct() {

    if (!productId) {

      loading.innerHTML = `
        <div style="color:#b42318;">
          <h2>Product ID haipo kwenye link.</h2>
          <p style="margin-top:10px;">
            Rudi Shop na uchague bidhaa.
          </p>
        </div>
      `;

      return;

    }


    console.log(
      "Loading product ID:",
      productId
    );


    const {
      data,
      error
    } = await supabaseClient
      .from("products")
      .select("*")
      .eq("id", productId)
      .eq("is_active", true)
      .single();


    if (error) {

      console.error(
        "SUPABASE PRODUCT ERROR:",
        error
      );

      loading.innerHTML = `
        <div style="color:#b42318;">

          <h2>Unable to load product</h2>

          <p style="margin-top:10px;">
            ${error.message || "Unknown Supabase error"}
          </p>

          <p style="margin-top:10px;font-size:13px;">
            Product ID:
            ${productId}
          </p>

        </div>
      `;

      return;

    }


    if (!data) {

      loading.innerHTML = `
        <div style="color:#b42318;">
          <h2>Product not found</h2>
        </div>
      `;

      return;

    }


    product = data;


    renderProduct();

  }


  /* =========================================
     DISPLAY PRODUCT
  ========================================= */

  function renderProduct() {

    loading.style.display =
      "none";

    productBox.style.display =
      "grid";


    productName.textContent =
      product.name;


    productCategory.textContent =
      product.category;


    productPrice.textContent =
      formatPrice(product.price);


    productDescription.textContent =
      product.description ||
      "No description available.";


    /* IMAGE */

    if (
      product.image_url &&
      (
        product.image_url.startsWith("http") ||
        product.image_url.startsWith("/")
      )
    ) {

      productImage.innerHTML = `
        <img
          src="${product.image_url}"
          alt="${product.name}"
        >
      `;

    } else {

      productImage.innerHTML = `
        <div class="emoji-image">
          ${product.image_url || "🛍️"}
        </div>
      `;

    }


    /* STOCK */

    if (Number(product.stock) > 0) {

      stockText.textContent =
        "✓ " +
        product.stock +
        " items available";

      stockText.className =
        "stock in-stock";

      addBtn.disabled = false;
      buyBtn.disabled = false;

    } else {

      stockText.textContent =
        "Out of stock";

      stockText.className =
        "stock out-stock";

      addBtn.disabled = true;
      buyBtn.disabled = true;

    }


    updateQuantityButtons();

  }


  /* =========================================
     QUANTITY
  ========================================= */

  function updateQuantityButtons() {

    quantityText.textContent =
      quantity;

    minusBtn.disabled =
      quantity <= 1;

    plusBtn.disabled =
      !product ||
      quantity >= Number(product.stock);

  }


  minusBtn.addEventListener(
    "click",
    function() {

      if (quantity > 1) {

        quantity--;

        updateQuantityButtons();

      }

    }
  );


  plusBtn.addEventListener(
    "click",
    function() {

      if (
        product &&
        quantity < Number(product.stock)
      ) {

        quantity++;

        updateQuantityButtons();

      }

    }
  );


  /* =========================================
     ADD TO CART
  ========================================= */

  function addToCart(goToCheckout = false) {

    if (!product) return;

    const availableStock = Number(product.stock);

    if (availableStock <= 0) {
      showMessage("This product is out of stock.", "error");
      return;
    }

    if (quantity < 1 || quantity > availableStock) {
      showMessage("Selected quantity exceeds available stock.", "error");
      return;
    }

    let cart;
    try {
      cart = JSON.parse(localStorage.getItem("shopSphereCart") || "[]");
      if (!Array.isArray(cart)) cart = [];
    } catch (error) {
      console.error("Cart data error:", error);
      cart = [];
    }

    const existing = cart.find(item => item.id === product.id);

    if (existing) {
      const currentQuantity = Number(existing.quantity) || 0;
      const newQuantity = currentQuantity + quantity;

      if (newQuantity > availableStock) {
        showMessage("You cannot add more than the available stock.", "error");
        return;
      }

      existing.quantity = newQuantity;
      existing.stock = availableStock;
      existing.price = Number(product.price);
      existing.image_url = product.image_url;
      existing.category = product.category;
      existing.name = product.name;
    } else {
      cart.push({
        id: product.id,
        name: product.name,
        price: Number(product.price),
        quantity: quantity,
        stock: availableStock,
        image_url: product.image_url,
        category: product.category
      });
    }

    localStorage.setItem("shopSphereCart", JSON.stringify(cart));
    updateCartCount();

    if (goToCheckout) {
      window.location.href = "checkout.html";
    } else {
      showMessage(quantity + " × " + product.name + " added to cart.", "success");
    }
  }


  addBtn.addEventListener(
    "click",
    function() {

      addToCart(false);

    }
  );


  buyBtn.addEventListener(
    "click",
    function() {

      addToCart(true);

    }
  );


  /* =========================================
     START
  ========================================= */

  updateCartCount();

  loadProduct();

</script>

</body>
</html>
