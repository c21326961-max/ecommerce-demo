<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — ShopSphere</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #334155, transparent 35%),
        radial-gradient(circle at bottom right, #1e3a8a, transparent 35%),
        #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 24px;
      padding: 38px 32px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
    }

    h1 {
      text-align: center;
      color: #111827;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .admin-badge {
      display: block;
      width: fit-content;
      margin: 0 auto 25px;
      padding: 7px 14px;
      border-radius: 999px;
      background: #eff6ff;
      color: #2563eb;
      font-size: 12px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #374151;
      font-size: 14px;
      font-weight: 700;
    }

    .input-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
      background: #f9fafb;
    }

    input:focus {
      border-color: #2563eb;
      background: white;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .password-input {
      padding-right: 55px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
      padding: 5px;
    }

    .login-btn {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-message {
      display: none;
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 18px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #9ca3af;
      font-size: 12px;
    }

    .security-note {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      background: #f8fafc;
      color: #64748b;
      text-align: center;
      font-size: 11px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 30px 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="login-card">

      <div class="logo">S</div>

      <h1>ShopSphere</h1>

      <p class="subtitle">
        Admin Dashboard Login
      </p>

      <span class="admin-badge">
        🔐 ADMIN ACCESS
      </span>

      <div id="errorMessage" class="error-message">
        Invalid username or password.
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="username">Username</label>

          <input
            type="text"
            id="username"
            placeholder="Enter admin username"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="input-wrapper">

            <input
              type="password"
              id="password"
              class="password-input"
              placeholder="Enter admin password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-password"
              id="showPassword"
              aria-label="Show password"
            >
              👁️
            </button>

          </div>
        </div>

        <button type="submit" class="login-btn">
          🔐 Login to Dashboard
        </button>

      </form>

      <div class="security-note">
        This area is restricted to ShopSphere administrators.
      </div>

      <div class="footer">
        © 2026 ShopSphere — Admin Panel
      </div>

    </div>

  </div>


  <script>

    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "1234";

    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const errorMessage = document.getElementById("errorMessage");
    const showPassword = document.getElementById("showPassword");


    // Show / Hide password
    showPassword.addEventListener("click", function () {

      if (passwordInput.type === "password") {

        passwordInput.type = "text";
        showPassword.textContent = "🙈";

      } else {

        passwordInput.type = "password";
        showPassword.textContent = "👁️";

      }

    });


    // Login
    loginForm.addEventListener("submit", function (event) {

      event.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
      ) {

        // Create admin session
        sessionStorage.setItem(
          "shopSphereAdminLoggedIn",
          "true"
        );

        // Go to dashboard
        window.location.replace("dashboard.html");

      } else {

        errorMessage.style.display = "block";

        passwordInput.value = "";

        passwordInput.focus();

      }

    });


    // Hide error when user starts typing again
    usernameInput.addEventListener("input", function () {
      errorMessage.style.display = "none";
    });

    passwordInput.addEventListener("input", function () {
      errorMessage.style.display = "none";
    });

  </script>

</body>
</html>
