<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout — ShopSphere</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #101827;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 24px;
      font-weight: 800;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: 45px auto;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 30px;
    }

    .checkout-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-bottom: 22px;
      font-size: 21px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #d9dee8;
      border-radius: 10px;
      padding: 13px 14px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #4f46e5;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .required {
      color: #dc2626;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .summary-name {
      font-weight: 700;
    }

    .summary-quantity {
      color: #667085;
      font-size: 13px;
      margin-top: 5px;
    }

    .summary-price {
      font-weight: 700;
      white-space: nowrap;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 18px;
      color: #667085;
    }

    .total {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      border-top: 1px solid #e5e7eb;
      margin-top: 20px;
      padding-top: 20px;
      font-size: 22px;
      font-weight: 800;
    }

    .payment-note {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #f3f4ff;
      color: #3730a3;
      font-size: 14px;
      line-height: 1.6;
    }

    .place-order {
      width: 100%;
      border: none;
      background: #111827;
      color: white;
      padding: 16px;
      border-radius: 12px;
      margin-top: 25px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .place-order:hover {
      opacity: 0.9;
    }

    .empty {
      text-align: center;
      padding: 70px 20px;
      background: white;
      border-radius: 18px;
    }

    .empty-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    .empty p {
      color: #667085;
      margin: 10px 0 25px;
    }

    .shop-btn {
      display: inline-block;
      background: #111827;
      color: white;
      text-decoration: none;
      padding: 13px 22px;
      border-radius: 10px;
      font-weight: 700;
    }

    .success-message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #ecfdf3;
      color: #067647;
    }

    @media (max-width: 850px) {
      .checkout-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 28px;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>

  <a href="index.html" class="logo">
    ShopSphere
  </a>

  <a href="cart.html" class="back">
    ← Back to Cart
  </a>

</header>


<div class="container">

  <h1>Checkout</h1>

  <p class="subtitle">
    Enter your information and review your order.
  </p>


  <div id="checkoutContent"></div>

</div>


<script>

const CART_KEY = "shopSphereCart";


function getCart() {

  try {

    return JSON.parse(
      localStorage.getItem(CART_KEY)
    ) || [];

  } catch (error) {

    return [];

  }

}


function formatPrice(price) {

  return Number(price).toLocaleString("en-US") + " TSh";

}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function renderCheckout() {

  const cart = getCart();

  const checkoutContent =
    document.getElementById("checkoutContent");


  if (cart.length === 0) {

    checkoutContent.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🛒
        </div>

        <h2>
          Your cart is empty
        </h2>

        <p>
          Please add products before checkout.
        </p>

        <a
          href="products.html"
          class="shop-btn">

          Go to Shop

        </a>

      </div>

    `;

    return;

  }


  let subtotal = 0;

  let productsHTML = "";


  cart.forEach(item => {

    const quantity =
      Number(item.quantity) || 1;

    const price =
      Number(item.price) || 0;

    const total =
      price * quantity;

    subtotal += total;


    productsHTML += `

      <div class="summary-item">

        <div>

          <div class="summary-name">

            ${escapeHtml(item.name)}

          </div>

          <div class="summary-quantity">

            Quantity: ${quantity}

          </div>

        </div>

        <div class="summary-price">

          ${formatPrice(total)}

        </div>

      </div>

    `;

  });


  checkoutContent.innerHTML = `

    <div class="checkout-layout">


      <div class="card">

        <h2>
          Customer Information
        </h2>


        <form id="checkoutForm">


          <div class="form-group">

            <label>
              Full Name <span class="required">*</span>
            </label>

            <input
              type="text"
              id="fullName"
              placeholder="Enter your full name"
              required>

          </div>


          <div class="form-group">

            <label>
              Phone Number <span class="required">*</span>
            </label>

            <input
              type="tel"
              id="phone"
              placeholder="e.g. 0712345678"
              required>

          </div>


          <div class="form-group">

            <label>
              Email Address
            </label>

            <input
              type="email"
              id="email"
              placeholder="example@email.com">

          </div>


          <div class="form-group">

            <label>
              Delivery Address <span class="required">*</span>
            </label>

            <textarea
              id="address"
              placeholder="Enter your delivery address"
              required></textarea>

          </div>


          <div class="form-group">

            <label>
              Additional Notes
            </label>

            <textarea
              id="notes"
              placeholder="Any additional information..."></textarea>

          </div>


          <button
            type="submit"
            class="place-order">

            Continue to Payment

          </button>


          <div
            id="successMessage"
            class="success-message">

            Information saved. Preparing payment...

          </div>


        </form>

      </div>


      <div class="card">

        <h2>
          Order Summary
        </h2>


        ${productsHTML}


        <div class="summary-row">

          <span>
            Subtotal
          </span>

          <strong>
            ${formatPrice(subtotal)}
          </strong>

        </div>


        <div class="summary-row">

          <span>
            Delivery
          </span>

          <span>
            Calculated later
          </span>

        </div>


        <div class="total">

          <span>
            Total
          </span>

          <span>
            ${formatPrice(subtotal)}
          </span>

        </div>


        <div class="payment-note">

          🔒 Your order will be reviewed before payment
          is completed.

        </div>

      </div>


    </div>

  `;


  document
    .getElementById("checkoutForm")
    .addEventListener("submit", handleCheckout);

}


function handleCheckout(event) {

  event.preventDefault();


  const fullName =
    document.getElementById("fullName").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const address =
    document.getElementById("address").value.trim();

  const notes =
    document.getElementById("notes").value.trim();


  const customerData = {

    fullName,
    phone,
    email,
    address,
    notes,

    createdAt:
      new Date().toISOString()

  };


  localStorage.setItem(
    "shopSphereCustomer",
    JSON.stringify(customerData)
  );


  document.getElementById(
    "successMessage"
  ).style.display = "block";


  setTimeout(() => {

    window.location.href =
      "payment.html";

  }, 1000);

}


renderCheckout();

</script>

</body>
</html>
